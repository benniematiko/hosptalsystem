<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fa; margin: 0; }
    .box { max-width: 600px; margin: 80px auto; background: #fff; padding: 32px;
           border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { color: #0b6e99; margin-top: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>{{ title }}</h1>
    <p>Welcome, {{ request.user.get_full_name|default:request.user.username }}.</p>
    <p>Role: {{ request.user.get_role_display }}</p>
  </div>
  <script>
    console.log("Dashboard loaded");
  </script>
</body>
</html>
